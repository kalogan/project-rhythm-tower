name: gate

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm typecheck

      - name: lint + arch-guard
        run: pnpm lint && pnpm arch

      - name: content + biome lint
        run: pnpm lint:content && pnpm lint:biome

      - name: test
        run: pnpm test

      - name: build (deploy)
        run: pnpm build
